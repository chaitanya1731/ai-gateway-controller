apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maas-consumer-portal
  labels:
    app.kubernetes.io/name: maas-consumer-portal
    app.kubernetes.io/part-of: maas-consumer-portal
spec:
  hostnames:
    - CONSUMER_PORTAL_HOSTNAME
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: CONSUMER_PORTAL_GATEWAY_NAME
      namespace: CONSUMER_PORTAL_GATEWAY_NAMESPACE
  rules:
    - matches:
        - path:
            type: Exact
            value: /maas-portal
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 302
            path:
              type: ReplaceFullPath
              replaceFullPath: /maas-portal/
    - matches:
        - path:
            type: PathPrefix
            value: /maas-portal
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: maas-portal
          namespace: CONSUMER_PORTAL_DASHBOARD_NAMESPACE
          port: 8443
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maas-consumer-portal-oauth2
  labels:
    app.kubernetes.io/name: maas-consumer-portal-oauth2
    app.kubernetes.io/part-of: maas-consumer-portal
spec:
  hostnames:
    - CONSUMER_PORTAL_HOSTNAME
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: CONSUMER_PORTAL_GATEWAY_NAME
      namespace: CONSUMER_PORTAL_GATEWAY_NAMESPACE
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - group: ""
          kind: Service
          name: maas-consumer-portal-auth-proxy
          port: 4180
          weight: 1
