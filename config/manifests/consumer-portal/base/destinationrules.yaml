apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: maas-consumer-portal-auth-proxy-backend-tls
  labels:
    app.kubernetes.io/name: maas-consumer-portal-auth-proxy
    app.kubernetes.io/part-of: maas-consumer-portal
spec:
  host: maas-consumer-portal-auth-proxy.CONSUMER_PORTAL_NAMESPACE.svc.cluster.local
  trafficPolicy:
    portLevelSettings:
      - port:
          number: 4180
        tls:
          mode: SIMPLE
          insecureSkipVerify: true
          sni: maas-consumer-portal-auth-proxy.CONSUMER_PORTAL_NAMESPACE.svc.cluster.local
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: maas-consumer-portal-backend-tls
  labels:
    app.kubernetes.io/name: maas-consumer-portal
    app.kubernetes.io/part-of: maas-consumer-portal
spec:
  host: maas-portal.CONSUMER_PORTAL_DASHBOARD_NAMESPACE.svc.cluster.local
  trafficPolicy:
    portLevelSettings:
      - port:
          number: 8443
        tls:
          mode: SIMPLE
          insecureSkipVerify: true
          sni: maas-portal.CONSUMER_PORTAL_DASHBOARD_NAMESPACE.svc.cluster.local
